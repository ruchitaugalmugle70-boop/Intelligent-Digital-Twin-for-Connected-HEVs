services:
  postgres:
    image: postgres:16
    container_name: elespa-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: elespa_digital_twin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
